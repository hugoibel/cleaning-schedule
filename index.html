<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cleaning"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Calendario de Limpieza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#14213D">
<style>
/* Layout: en el teléfono, una sola pantalla de app (barra superior, contenido con scroll, pestañas abajo).
   En la computadora (>= 1000px): barra lateral azul marino, cabecera con navegación y tablas anchas.
   Paleta del Master Cleaning Schedule: azul marino de planta + un color por frecuencia. */
:root {
  --bar: #14213D; --bar-sub: #B7C4DD; --bar-fg: #FFFFFF;
  --bg: #F3F6FB; --card: #FFFFFF; --ink: #1B2638; --muted: #56657D;
  --line: #D5DCE8; --line-2: #E6EBF3; --track: #E2E8F1; --hover: #EEF2F8;
  --sel: #14213D; --sel-fg: #FFFFFF; --sel-sub: #B7C4DD;
  --done-bg: #D8F0DE; --done-ink: #14532D; --done-solid: #1F8A4C; --done-soft: #F2FAF4; --done-line: #BFE3C9;
  --flag-bg: #FFE45C; --flag-ink: #5A3A00; --flag-line: #D9B800;
  --na-bg: #E7EAF0; --na-ink: #3B4B66; --na-line: #B5BFD0;
  --warn-bg: #FFF6D6; --warn-line: #F0D98A; --warn-ink: #5A3A00;
  --danger: #B42318; --danger-line: #F1B8B2;
  --ring: #AEB9CC; --scrim: rgba(20,33,61,.55); --toast: #1B2638; --toast-fg: #FFFFFF; --toast-link: #8EC5FF;
  --side-hover: #1E2F52; --side-on: #2B4373; --col: #EAF1FC; --off: #F0F2F6; --live: #3FBF74;
  --miss-bg: #FCE3C2; --miss-ink: #7A3300; --miss-line: #E39A4E;
  --font: 'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bar: #0E1830; --bar-sub: #93A3C2; --bar-fg: #F2F5FA;
    --bg: #0B1222; --card: #141E33; --ink: #E7ECF4; --muted: #9AA8BF;
    --line: #2A3753; --line-2: #222E47; --track: #26324B; --hover: #1B2740;
    --sel: #3B5B9A; --sel-fg: #FFFFFF; --sel-sub: #D3DDF0;
    --done-bg: #1D4A30; --done-ink: #BFF0CF; --done-solid: #2FA764; --done-soft: #142B20; --done-line: #285C3D;
    --flag-bg: #E8C93A; --flag-ink: #3A2600; --flag-line: #B89A10;
    --na-bg: #2A3550; --na-ink: #C9D3E6; --na-line: #45547A;
    --warn-bg: #3A3014; --warn-line: #6B5A22; --warn-ink: #F5DE95;
    --danger: #FF8A80; --danger-line: #6E2B27;
    --ring: #56658A; --scrim: rgba(0,0,0,.6); --toast: #E7ECF4; --toast-fg: #0B1222; --toast-link: #1D4E89;
    --side-hover: #17243F; --side-on: #25395F; --col: #18284A; --off: #0F182B; --live: #3FBF74;
    --miss-bg: #4A2C10; --miss-ink: #FFD4A3; --miss-line: #9A6128;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bar: #0E1830; --bar-sub: #93A3C2; --bar-fg: #F2F5FA;
  --bg: #0B1222; --card: #141E33; --ink: #E7ECF4; --muted: #9AA8BF;
  --line: #2A3753; --line-2: #222E47; --track: #26324B; --hover: #1B2740;
  --sel: #3B5B9A; --sel-fg: #FFFFFF; --sel-sub: #D3DDF0;
  --done-bg: #1D4A30; --done-ink: #BFF0CF; --done-solid: #2FA764; --done-soft: #142B20; --done-line: #285C3D;
  --flag-bg: #E8C93A; --flag-ink: #3A2600; --flag-line: #B89A10;
  --na-bg: #2A3550; --na-ink: #C9D3E6; --na-line: #45547A;
  --warn-bg: #3A3014; --warn-line: #6B5A22; --warn-ink: #F5DE95;
  --danger: #FF8A80; --danger-line: #6E2B27;
  --ring: #56658A; --scrim: rgba(0,0,0,.6); --toast: #E7ECF4; --toast-fg: #0B1222; --toast-link: #1D4E89;
  --side-hover: #17243F; --side-on: #25395F; --col: #18284A; --off: #0F182B; --live: #3FBF74;
  --miss-bg: #4A2C10; --miss-ink: #FFD4A3; --miss-line: #9A6128;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #4C8DF6; outline-offset: 2px; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; background: var(--bg); }

/* barra superior */
.appbar { flex: none; background: var(--bar); color: var(--bar-fg); padding: 10px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.appbar .sub { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--bar-sub); font-weight: 600; }
.monthbtn { background: none; border: 0; padding: 0; color: var(--bar-fg); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-height: 32px; }
.monthbtn svg { width: 18px; height: 18px; }
.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.cur { background: var(--done-bg); color: var(--done-ink); }
.pill.closed { background: var(--na-bg); color: var(--na-ink); }
.pill.edit { background: var(--flag-bg); color: var(--flag-ink); }
.pill.sync { background: transparent; color: var(--bar-sub); border: 1px solid currentColor; }

/* contenido */
main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 16px 28px; -webkit-overflow-scrolling: touch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.summary { padding: 14px 14px 12px; margin-bottom: 12px; }
.summary .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.summary .big { font-size: 28px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.small { font-size: 13px; color: var(--muted); }
.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 8px 0 6px; }
.bar > i { display: block; height: 100%; background: var(--done-solid); border-radius: 999px; }
.banner { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 14px; }
.banner button { background: var(--warn-ink); color: var(--warn-bg); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 600; min-height: 40px; flex: none; }
.banner.info { background: var(--card); border-color: var(--line); color: var(--muted); }

/* semanas */
.weeks { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: none; min-width: 78px; min-height: 56px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; text-align: left; }
.wk .d { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wk .p { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wk.sel { background: var(--sel); border-color: var(--sel); color: var(--sel-fg); }
.wk.sel .p { color: var(--sel-sub); }
.wk.now .d::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-left: 6px; vertical-align: middle; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 8px; font-size: 14px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; min-height: 44px; font-weight: 500; color: var(--ink); flex: none; }
.switch .t { width: 40px; height: 24px; border-radius: 999px; background: var(--ring); position: relative; transition: background .15s; }
.switch .t::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on .t { background: var(--done-solid); }
.switch.on .t::after { left: 19px; }

/* grupos y tareas */
.group { margin-bottom: 14px; }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 6px; }
.ghead .l { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.ghead .r { font-size: 13px; color: var(--muted); font-weight: 500; text-align: right; }
.fchip { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--fc); color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.task { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-height: 64px; }
.task.isdone { background: var(--done-soft); border-color: var(--done-line); }
.task .tx { flex: 1; min-width: 0; }
.task .nm { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.task .st { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.task .st b { color: var(--done-ink); font-weight: 600; }
.task .nt { font-size: 12.5px; color: var(--warn-ink); background: var(--warn-bg); border-radius: 6px; padding: 3px 7px; margin-top: 4px; display: inline-block; overflow-wrap: anywhere; }
.task.muted .nm { color: var(--muted); }
.chk { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ring); background: var(--card); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; font-weight: 700; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.chk:active { transform: scale(.94); }
.chk.done { background: var(--done-solid); border-color: var(--done-solid); color: #fff; font-size: 20px; }
.chk small { font-size: 10px; font-weight: 600; margin-top: 2px; letter-spacing: .02em; }
.chk.flag { background: var(--flag-bg); border-color: var(--flag-line); color: var(--flag-ink); font-size: 24px; }
.chk.na { background: var(--na-bg); border-color: var(--na-line); color: var(--na-ink); font-size: 13px; }
.chk.dis, .cell.dis { opacity: .55; }

/* cuadrícula del mes */
.gridwrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
.grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-2); padding: 0; text-align: center; }
.grid thead th { background: var(--bar); color: var(--bar-fg); font-size: 13px; padding: 8px 2px; font-variant-numeric: tabular-nums; }
.grid th.nm, .grid td.nm { position: sticky; left: 0; text-align: left; min-width: 150px; max-width: 150px; z-index: 1; background: var(--card); padding: 6px 8px; font-size: 12.5px; line-height: 1.25; }
.grid thead th.nm { background: var(--bar); font-size: 12px; letter-spacing: .08em; z-index: 2; }
.grid td.sum { font-size: 12px; font-weight: 600; color: var(--muted); min-width: 44px; font-variant-numeric: tabular-nums; }
.grid td.sum.ok { color: var(--done-ink); background: var(--done-soft); }
.grid tr.gh td { background: var(--hover); text-align: left; font-weight: 700; font-size: 12.5px; padding: 6px 8px; }
.grid tr.gh .fchip { height: 18px; min-width: 28px; font-size: 11px; margin-right: 6px; }
.cell { width: 100%; min-width: 44px; height: 46px; border: 0; background: transparent; font-size: 11px; font-weight: 700; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.cell.done { background: var(--done-bg); color: var(--done-ink); }
.cell.flag { background: var(--flag-bg); color: var(--flag-ink); font-size: 16px; }
.cell.na { background: var(--na-bg); color: var(--na-ink); }
.cell small { font-size: 9.5px; font-weight: 600; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 4px 0; }

/* historial y ajustes */
.mcard { padding: 14px; }
.mcard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mcard .nm { font-size: 18px; font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--sel); border-color: var(--sel); color: var(--sel-fg); }
.btn.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.empty { text-align: center; color: var(--muted); padding: 28px 18px; font-size: 14px; }
h2.sec { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; font-weight: 700; }
.field { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line-2); }
.field:last-child { border-bottom: 0; }
.field label, .field .lab { font-weight: 600; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }
input[type=text], textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--ring); border-radius: 10px; background: var(--card); color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-weight: 600; }
.seg button.on { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 16px; color: var(--muted); }
.spin { width: 28px; height: 28px; border: 3px solid var(--track); border-top-color: var(--done-solid); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* pestañas */
.tabs { flex: none; display: flex; background: var(--card); border-top: 1px solid var(--line); }
.tabs button { flex: 1; min-height: 58px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); }
.tabs button.on svg { stroke-width: 2.3; }

/* hojas y diálogos */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 720px; margin: 0 auto; max-height: 90%; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; z-index: 51; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--ring); margin: 4px auto 12px; }
.sheet h3, .dlg h3 { margin: 0; font-size: 18px; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 13.5px; margin: 2px 0 12px; }
.sheet .lbl { font-weight: 600; font-size: 13px; margin: 10px 0 4px; display: block; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; }
.opt .ic { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
.opt.done .ic { background: var(--done-solid); color: #fff; }
.opt.flag .ic { background: var(--flag-bg); color: var(--flag-ink); }
.opt.na .ic { background: var(--na-bg); color: var(--na-ink); font-size: 11px; }
.opt.clr { color: var(--danger); border-color: var(--danger-line); }
.opt.cancel { justify-content: center; color: var(--muted); border-color: transparent; }
.dlg { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 480px; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 18px 16px 16px; z-index: 51; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dlg p { margin: 6px 0 12px; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 16px; right: 16px; max-width: 688px; margin: 0 auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--toast); color: var(--toast-fg); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.toast button { background: none; border: 0; color: var(--toast-link); font-weight: 700; font-size: 14px; min-height: 36px; padding: 0 6px; flex: none; }
/* mejoras v2 */
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #3FBF74; box-shadow: 0 0 0 3px color-mix(in srgb, #3FBF74 25%, transparent); }
.live.off i { background: var(--ring); box-shadow: none; }
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; }
.alert b { font-weight: 700; }
.alert button { flex: none; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 600; }
.search { position: relative; margin: 0 0 10px; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.gbtn { min-height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 600; color: var(--ink); flex: none; }
.ghead .rt { display: flex; align-items: center; gap: 8px; }
/* días de la semana (tareas diarias y 2 veces por semana) */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; }
.dy { min-height: 56px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0; touch-action: manipulation; }
.dy .l { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.dy .n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dy i { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.dy i.part { background: var(--flag-line); }
.dy i.full { background: var(--done-solid); }
.dy.off .n { color: var(--muted); }
.dy.off { background: var(--bg); border-style: dashed; }
.dy.now .l { color: var(--done-solid); }
.dy.sel { background: var(--sel); border-color: var(--sel); border-style: solid; color: var(--sel-fg); }
.dy.sel .l { color: var(--sel-sub); }
.dy.sel .n { color: var(--sel-fg); }
.dy.sel i.full { background: #3FBF74; }
.wd { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.wd span { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; font-size: 10px; font-weight: 700; background: var(--track); color: var(--muted); }
.wd span.done { background: var(--done-solid); color: #fff; }
.wd span.flag { background: var(--flag-bg); color: var(--flag-ink); }
.wd span.na { background: var(--na-bg); color: var(--na-ink); }
.wd span.cur { box-shadow: 0 0 0 1.5px var(--ink); }
.cell.part { background: var(--warn-bg); color: var(--warn-ink); }
/* atrasado: día o semana que ya pasó sin la marca requerida */

      case 'tap': if (store.months[ui.month]) tapCell(d.t, Number(d.w), d.d || null); break;
      case 'undo': if (undoFn) { var f = undoFn; undoFn = null; $('#toast').hidden = true; f(); } break;
      case 'unlock': openDlg({ title: L('Edit a closed month', 'Editar mes cerrado'), text: L('This month is already saved as a copy. Are you sure you want to change it?', 'Este mes ya está guardado como copia. ¿Seguro que quieres cambiarlo?'), buttons: [{ label: L('Cancel', 'Cancelar'), fn: closeDlg }, { label: L('Edit', 'Editar'), cls: 'warn', fn: function () { ui.unlocked[ui.month] = true; closeDlg(); render(); } }] }); break;
      case 'relock': delete ui.unlocked[ui.month]; render(); break;
      case 'open': ui.month = d.k; ui.selDay = null; ui.week = d.k === ui.cur ? curWeekIdx(store.months[d.k]) : 0; ui.tab = 'week'; ui.q = ''; render(); $('#view').scrollTop = 0; break;
      case 'csv': offer((ES() ? 'Limpieza_' : 'Cleaning_') + d.k + '.csv', csvOf(store.months[d.k])); break;
      case 'printOpt': ui.sheet = { type: 'print', k: d.k, lang: prefs.printLang || 'en', blank: false }; renderOverlay(); break;
      case 'prLang': ui.sheet.lang = d.v; prefs.printLang = d.v; savePrefs(); renderOverlay(); break;
      case 'prBlank': ui.sheet.blank = d.v === '1'; renderOverlay(); break;
      case 'prGo':
        var pk = ui.sheet.k, po = { lang: ui.sheet.lang, blank: ui.sheet.blank }, phtml = printableOf(store.months[pk], po); closeSheet();
        if (!downloads && !IN_VIEWER) { var pw = null; try { pw = window.open('', '_blank'); } catch (e2) { pw = null; } if (pw) { pw.document.open(); pw.document.write(phtml); pw.document.close(); break; } }
        offer((po.lang === 'en' ? 'Cleaning_Schedule_' : 'Hoja_Limpieza_') + pk + (po.blank ? (po.lang === 'en' ? '_blank' : '_en_blanco') : '') + '.html', phtml); break;
      case 'nav': if (ui.tab === 'month') shiftMonth(Number(d.d)); else shiftWeek(Number(d.d)); break;
      case 'today': goToday(); break;
      case 'mview': prefs.mview = d.v === 'days' ? 'days' : 'weeks'; savePrefs(); render(); break;
      case 'help': showHelp(); break;
      case 'where': askWhere(); break;
      case 'exportAll': offer((ES() ? 'Limpieza_todo_' : 'Cleaning_backup_') + ymd(new Date()) + '.json', JSON.stringify(exportObj(Object.keys(store.months).sort()), null, 1)); break;
      case 'import': if (!blockRO()) $('#imp').click(); break;
      case 'lang': setLang(d.v); break;
      case 'editTask': if (!blockRO()) { ui.sheet = { type: 'task', id: d.id || null }; renderOverlay(); } break;
      case 'tsFreq': tsCapture(); ui.sheet.f = d.f; renderOverlay(); break;
      case 'tsSave': tsSave(); break;
      case 'tsToggle': tsToggle(); break;
      case 'sheetClose': closeSheet(); break;
      case 'setState': applySheet(d.s); break;
      case 'dlgCancel': if (!(ui.dlg && ui.dlg.noClose)) closeDlg(); break;
      case 'pin': askPin(false, true); break;
      case 'install': if (installEvt) { var ie = installEvt; ie.prompt(); ie.userChoice.then(function () { installEvt = null; render(); }, function () { /* */ }); } break;
      case 'dlgBtn': var b = ui.dlg && ui.dlg.buttons[Number(d.i)]; if (b) { var inp = $('#dlg-in'); b.fn(inp ? inp.value : ''); } break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (ui.dlg) { if (!ui.dlg.noClose) closeDlg(); } else if (ui.sheet) closeSheet(); else if (e.target && e.target.id === 'q' && ui.q) { ui.q = ''; render(); }
      return;
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'dlg-in' && ui.dlg) { var b = ui.dlg.buttons[ui.dlg.buttons.length - 1]; b.fn(e.target.value); return; }
    if (ui.dlg || ui.sheet || !store.booted || !store.months[ui.month]) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || (e.target && e.target.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, tabs = { '1': 'week', '2': 'month', '3': 'hist', '4': 'set' };
    if (tabs[k]) { ui.tab = tabs[k]; render(); $('#view').scrollTop = 0; }
    else if ((k === 'ArrowLeft' || k === 'ArrowRight') && (ui.tab === 'week' || ui.tab === 'month')) { if (ui.tab === 'month') shiftMonth(k === 'ArrowLeft' ? -1 : 1); else shiftWeek(k === 'ArrowLeft' ? -1 : 1); }
    else if (k === 'h' || k === 'H') goToday();
    else if (k === '/') { if (ui.tab !== 'week' || !ui.searchOpen) { ui.tab = 'week'; ui.searchOpen = true; render(); } var q = $('#q'); if (q) q.focus(); }
    else if ((k === 'p' || k === 'P') && ui.tab === 'week') { ui.pending = !ui.pending; render(); }
    else if (k === '?') showHelp();
    else return;
    e.preventDefault();
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'ini') { var v = e.target.value.toUpperCase().slice(0, 4); e.target.value = v; prefs.initials = v.trim(); savePrefs(); }
    if (id === 'q') { ui.q = e.target.value.slice(0, 60); render(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target && e.target.id, map = { 'doc-company': 'company', 'doc-site': 'site', 'doc-code': 'code' };
    if (!map[id] || blockRO()) return;
    tpl.doc = tpl.doc || { company: '', site: '', code: '' };
    var v = e.target.value.trim().slice(0, map[id] === 'code' ? 30 : 60);
    if (tpl.doc[map[id]] === v) return;
    tpl.doc[map[id]] = v; saveTemplate(); toast(L('Header saved', 'Encabezado guardado'));
  });
  $('#imp').addEventListener('change', function () { var inp = this, f = inp.files && inp.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { importText(String(r.result)); inp.value = ''; }; r.readAsText(f); });

  // pulsación larga en círculos y celdas
  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return; // el clic derecho abre el menú por su cuenta
    var el = e.target.closest('.chk, .cell'); if (!el) return;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { longFired = true; longPress(el.getAttribute('data-t'), Number(el.getAttribute('data-w')), el.getAttribute('data-d') || null); }, 480);
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(function (ev) {
    document.addEventListener(ev, function () { clearTimeout(pressTimer); if (longFired) setTimeout(function () { longFired = false; }, 400); }, true);
  });
  // clic derecho (o pulsación larga en Android): N/A, observación o quitar la marca
  document.addEventListener('contextmenu', function (e) {
    var el = e.target.closest('.chk, .cell'); if (!el) return;
    e.preventDefault(); clearTimeout(pressTimer);
    if (!el.getAttribute('data-t') || !store.months[ui.month]) return;
    longPress(el.getAttribute('data-t'), Number(el.getAttribute('data-w')), el.getAttribute('data-d') || null);
  });
  // al pasar de teléfono a computadora (o al cambiar el ancho de la ventana) cambia el diseño
  if (MQ) { if (MQ.addEventListener) MQ.addEventListener('change', function () { render(); }); else if (MQ.addListener) MQ.addListener(function () { render(); }); }

  /* ------------------------------------------------- se actualiza sola
     Con la app abierta: cambia de día, de semana y de mes sin recargar.
     Los cambios de otros dispositivos llegan en vivo por la suscripción. */
  function refreshClock(force) {
    if (!store.booted) return;
    var today = ymd(new Date());
    var dayChanged = today !== ui.day;
    // si se estaba viendo "hoy", al cambiar de día pasa al día nuevo (en blanco para las diarias)
    if (dayChanged && (!ui.selDay || ui.selDay === ui.day)) ui.selDay = null;
    var prev = ui.cur;
    ui.cur = ensureMonths();
    if (prev && prev !== ui.cur && ui.month === prev) { ui.month = ui.cur; ui.week = curWeekIdx(store.months[ui.cur]); ui.q = ''; if (ui.sheet && ui.sheet.type === 'cell') closeSheet(); toast(monthName(ui.cur) + L(' has started. ', ' empezó. ') + monthName(prev) + L(' was saved in History.', ' quedó guardado en el Historial.')); }
    else if (dayChanged && ui.month === ui.cur && store.months[ui.cur]) { var oldWk = ui.week, nw = curWeekIdx(store.months[ui.cur]); if (ui.day && nw !== oldWk && oldWk === curWeekIdxFor(store.months[ui.cur], ui.day)) ui.week = nw; }
    if (!store.months[ui.month]) ui.month = ui.cur;
    ui.day = today;
    if (force || dayChanged || prev !== ui.cur) render();
  }
  function curWeekIdxFor(mo, day) { for (var i = 0; i < mo.weeks.length; i++) if (mo.weeks[i] >= day) return i; return mo.weeks.length - 1; }
  setInterval(function () { refreshClock(false); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refreshClock(false); pollApi(); } });
  window.addEventListener('online', function () { flushOutbox(); pollApi(); });
  // instalar como app (Chrome, Edge, Android)
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; render(); toast(L('App installed', 'App instalada')); });
  window.addEventListener('focus', function () { refreshClock(false); });
  window.addEventListener('pageshow', function () { refreshClock(false); });

  /* ---------------------------------------------------------------- arranque */
  render();
  var started = false;
  function fallback() { if (!started) { started = true; startLocal(); } }
  if (IN_VIEWER) {
    // la versión dentro de Claude queda de solo lectura y manda a la app nueva
    store.moved = true; store.readOnly = true;
    window.claude.use('downloads').then(function (dl) { downloads = dl || null; if (store.booted) render(); }).catch(function () { downloads = null; });
    window.claude.use('db').then(function (db) { if (started) return; started = true; if (db) startCloud(db); else startLocal(); }).catch(fallback);
    // ¿puede esta persona escribir? Si la plataforma dice que no, la página queda en solo lectura desde el principio
    window.claude.use('user').then(function (u) {
      if (!u) return;
      Promise.all([u.isOwner(), u.can('data.write')]).then(function (r) { store.isOwner = !!r[0]; if (!r[0] && r[1] === false) setReadOnly(); }).catch(function () { /* sin datos: decide la primera escritura */ });
    }).catch(function () { /* sin datos de la persona */ });
    setTimeout(fallback, 12000);
  } else if (API) {
    startApi();
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo sin conexión */ });
  } else {
    fallback();
  }
})();
</script>
